minimumLimaVersion: 2.1.3
vmType: qemu
arch: x86_64
images:
  - location: https://cloud-images.ubuntu.com/minimal/releases/noble/release-20261105/ubuntu-24.04-minimal-cloudimg-amd64.img
    digest: "sha256:406630c08b5e545fcc7209854b129d47e3af822db128c9f19336593b5a2d3fe0"
    arch: x86_64
os: Linux
cpus: 2
memory: 2GiB
disk: 12GiB
mounts: []
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
hostResolver:
  enabled: true
  ipv6: true
portForwards:
  - guestIP: "0.0.0.0"
    guestIPMustBeZero: false
    proto: any
    ignore: true
provision:
  - mode: boot
    script: |
      if [ -x /usr/local/lib/lfcs/ensure-host-access.sh ]; then
        /usr/local/lib/lfcs/ensure-host-access.sh --boot
      fi
