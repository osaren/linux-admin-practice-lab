minimumLimaVersion: 2.3.0
vmType: qemu
arch: x86_64
images:
  - location: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-43-1.6.x86_64.qcow2
    digest: "sha256:846574c8a97cd2d8dc1f231062d73107cc85cbbbda56335e264a46e3a6c8ab2f"
    arch: x86_64
os: Linux
cpus: 2
memory: 2GiB
disk: 12GiB
mounts: []
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  overVsock: false
hostResolver:
  enabled: true
  ipv6: true
portForwards:
  # All lab endpoints are intentionally guest-local. SSH management is exempt
  # from ignore rules, so suppress only unnecessary automatic service forwards.
  - guestIP: "0.0.0.0"
    guestIPMustBeZero: false
    proto: any
    ignore: true
